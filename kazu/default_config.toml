[influxdb3]
# InfluxDB 3 endpoint, e.g. https://influxdb.example.com
host = ""
# Destination database
database = ""
# Token with query and write access to the database; checked with SELECT 1 on startup.
token = ""
# Query and write timeout in seconds.
timeout = 15.0

[sources.ssp]
# Complete HTTP Authorization value; use the Bearer scheme and a non-empty credential.
authorization = ""
# Gateway base URL where encrypted messages are sent.
gateway_base_url = "https://x1.thecores.top"
# Base URL of the SSP API, used for API requests wrapped in gateway message.
api_base_url = "https://s1.thefew01.top/api/v1"
# Request timeout in seconds.
timeout = 15.0
