# All fields are optional. Credentials belong in the adjacent .env file.
[metrics]
# HTTP listen address.
host = "127.0.0.1"
# HTTP listen port for GET /metrics.
port = 9101

[sources]
# Shared defaults; individual sources can override these fields.
# auto tries CLI first, then API.
source = "auto"
# Seconds between queries.
interval = 120.0
# Timeout for each CLI command or HTTP request, in seconds.
timeout = 30.0
# Pause after this many unconsumed polls.
idle_poll_limit = 5

[sources.ssp]
enabled = false
# Gateway base URL where encrypted messages are sent.
gateway_base_url = "https://x1.thecores.top"
# Base URL of the SSP API, used for API requests wrapped in gateway messages.
api_base_url = "https://s1.thefew01.top/api/v1"

[sources.tinyfish]
enabled = false

[sources.tavily]
enabled = false

[sources.firecrawl]
enabled = false

[sources.parallel]
enabled = false
