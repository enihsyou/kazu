version: "3"

vars:
  IMAGE: kazu

tasks:
  docker-build:
    desc: Build the kazu Docker image.
    vars:
      VERSION:
        sh: uv version --short
    cmds:
      - docker build --label org.opencontainers.image.version={{.VERSION}} -t {{.IMAGE}} .

  docker-prepare-run:
    desc: Create, provision, and start the kazu Docker container.
    vars:
      CONTAINER: kazu-task
    cmds:
      - docker rm -f "{{.CONTAINER}}" || true
      - docker create --rm -it --name "{{.CONTAINER}}" --entrypoint /bin/bash {{.IMAGE}}
      - cmd: 'docker cp "{{env "HOME"}}/.config/kazu/." "{{.CONTAINER}}:/root/.config/kazu/"'
        platforms: [linux]
      - cmd: 'docker cp "{{env "HOME"}}/Library/Application Support/kazu/." "{{.CONTAINER}}:/root/.config/kazu/"'
        platforms: [darwin]
      - cmd: 'docker cp "{{env "LOCALAPPDATA"}}/KokomiNetwork/kazu/." "{{.CONTAINER}}:/root/.config/kazu/"'
        platforms: [windows]

  test:
    desc: Run the test suite.
    cmds:
      - uv run pytest

  lint:
    desc: Apply Ruff lint fixes.
    cmds:
      - uv run ruff check --fix
