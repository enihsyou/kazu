[project]
name = "kazu"
version = "0.1.0"
description = "数 (kazu) — CLI for collecting structured usage statistics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45.0.0",
  "httpx>=0.28.0",
  "platformdirs>=4.10.0",
  "rich>=13.7.0",
]

[dependency-groups]
dev = [
  "ruff>=0.13.0",
]

[project.scripts]
kazu = "kazu.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kazu"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
