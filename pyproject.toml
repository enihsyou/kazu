[project]
name = "kazu"
version = "0.2.0"
description = "数 (kazu) — Prometheus exporter for account usage and balances"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45.0.0",
  "httpx>=0.28.0",
  "platformdirs>=4.10.0",
  "prometheus-client>=0.26.0",
  "pytest>=9.1.1",
  "python-dotenv>=1.2.4",
  "rich>=13.7.0",
  "tzdata>=2026.3",
]

[dependency-groups]
dev = [
  "ruff>=0.13.0",
]

[project.scripts]
kazu = "kazu.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "kazu/**/*" },
]

[tool.hatch.build.targets.wheel]
packages = ["kazu"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "kazu/_docs"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
  "network: test requests public network resources and skips when they are unreachable",
]
